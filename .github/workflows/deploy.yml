# Finance Dashboard — CI + cPanel FTPS deployment.
#
# Two-stage pipeline:
#
#   1. `tests` — runs PHP lint, the static security scan, the unit test
#      suite (pure PHP), and the integration test suite (backed by a real
#      MySQL 8 service). Fails the whole workflow if any check fails.
#      Nothing about deploy runs until this job is green.
#
#   2. `deploy` — needs: tests. Only fires on push to master/main (or a
#      manual dispatch). Uploads via FTPS using the repo's cPanel secrets.
#      Sensitive files (config.php, VAPID keys, migrations, uploads, docs)
#      are excluded from the upload — the server's own config.php is never
#      overwritten.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    — cPanel FTP host, e.g. ftp.kktechsolutions.in
#   FTP_USERNAME  — the FTP user (cPanel → FTP Accounts).
#   FTP_PASSWORD  — the FTP account password. Never hard-coded.
#   FTP_PORT      — optional, defaults to 21 (FTPS/explicit).
#   FTP_REMOTE_DIR — optional, defaults to "./"; set to the site's docroot.
#
# The workflow uses FTPS (explicit TLS) with `security: loose`. Loose still
# encrypts the connection; it only relaxes the hostname check on the FTP
# server's cert, which is required on shared cPanel hosts where the cert is
# for the underlying provider (e.g. *.interactivedns.com) rather than the
# customer's domain.

name: CI + Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # 1. Tests — must pass before anything is deployed.
  # ---------------------------------------------------------------------
  tests:
    name: Lint + unit + integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: finance_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, openssl, curl, json
          coverage: none

      - name: Wait for MySQL to be reachable
        run: |
          for i in {1..40}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MySQL never came up"
          exit 1

      - name: PHP lint every .php file
        run: |
          fail=0
          total=0
          while IFS= read -r -d '' f; do
            total=$((total+1))
            out=$(php -l "$f" 2>&1)
            if ! echo "$out" | grep -q "No syntax errors"; then
              echo "FAIL: $f"
              echo "$out"
              fail=$((fail+1))
            fi
          done < <(find . -name "*.php" -type f -not -path './.git/*' -not -path './videos/*' -print0)
          echo "PHP lint: $((total-fail))/$total PASS"
          if [ "$fail" -ne 0 ]; then
            echo "::error::PHP syntax errors — aborting."
            exit 1
          fi

      - name: Static security scan (SQL / XSS / open-redirect / dynamic include)
        run: php scripts/security-scan.php

      - name: Run PHP tests (unit + integration)
        env:
          TEST_DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=finance_test;charset=utf8mb4"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
        run: php tests/run.php

  # ---------------------------------------------------------------------
  # 2. Deploy — only runs on push to master/main after tests are green.
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to cPanel (FTPS)
    needs: tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret '$name' is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required FTPS secrets present."

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          # `loose` still encrypts the connection with TLS; it only relaxes
          # the hostname check on the server's cert. This is standard on
          # shared cPanel hosting where the FTP cert is for the underlying
          # provider (e.g. *.interactivedns.com) rather than the customer's
          # domain.
          security: loose
          server-dir: ${{ secrets.FTP_REMOTE_DIR || './' }}
          local-dir: ./
          # Files EXCLUDED from every deploy — never overwrite the server's
          # config.php or user-uploaded files, and don't ship dev-only paths.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/videos/**
            **/docs/**
            **/tests/**
            **/database/README.md
            **/database/schema.sql
            **/database/seed.sql
            **/database/migration-*.sql
            **/config.php
            **/config.local.php
            **/config.example.php
            **/db-diag.php
            # uploads/ is created ONCE on the server (with its own .htaccess
            # guard) and holds live user files. Never overwrite from CI —
            # excluded entirely to avoid clobbering or 553 errors on hosts
            # that don't auto-create the directory.
            **/uploads/**
            **/*.log
            **/*.bak
            **/*.backup
            **/*.sql.gz
            **/*.tmp
            **/*.swp
            **/*.pem
            **/*.key
            **/.env*
            **/README.md
            **/deploy.yml
